<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language App Edit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section id="player">
    <div id="stage">
      <video id="video" src="media/source.mp4" preload="auto"></video>
      <div id="fastBanner" hidden></div>
      <div id="sectionCard" hidden></div>
      <div id="caption" hidden></div>
    </div>
    <div id="controls">
      <button id="play" title="Play/pause (space)">▶</button>
      <span id="time">0:00 / 0:00</span>
      <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in edited video">
      <label>Speed
        <select id="rate">
          <option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option>
        </select>
      </label>
      <button id="cc" class="toggle on" title="Captions (c)">CC</button>
      <button id="zoomBtn" class="toggle on" title="Zoom on active pane (z)">Zoom</button>
      <button id="rawBtn" class="toggle" title="Play the source unedited, including cut parts (r)">Unedited</button>
      <button id="mute" title="Mute (m)">🔊</button>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <button id="fs" title="Fullscreen (f)">⛶</button>
    </div>
  </section>

  <section id="editor">
    <div id="summary"></div>
    <div id="timeline" title="Click to seek. Colours: normal, sped up, cut."><div id="segs"></div><div id="zoomLane"></div><div id="playhead"></div></div>

    <div id="panels">
      <div class="panel" id="segPanel">
        <h2>Segment</h2>
        <div id="segInfo"></div>
        <div class="row" id="modeBtns">
          <button data-mode="normal">Normal (1)</button>
          <button data-mode="fast">Speed up (2)</button>
          <button data-mode="cut">Cut (3)</button>
        </div>
        <div class="row">
          <label>Speed <input id="segSpeed" type="number" min="2" max="120" step="1"></label>
          <label class="grow">Title over speed-up <input id="segLabel" type="text"></label>
        </div>
        <div class="row">
          <button id="split" title="Split at playhead (s)">Split at playhead</button>
          <button id="mergeNext">Merge with next</button>
          <button id="nudgeStart">Start → playhead</button>
          <button id="nudgeEnd">End → playhead</button>
        </div>
        <h2>Pauses inside normal segments</h2>
        <div class="row">
          <label><input id="autoSilence" type="checkbox"> Speed up pauses longer than</label>
          <input id="silenceMin" type="number" min="1" max="30" step="0.5"> s at
          <input id="silenceSpeed" type="number" min="2" max="16" step="1">×
        </div>
        <h2>Zoom at playhead</h2>
        <div class="row" id="zoomBtns">
          <button data-z="full">Full</button>
          <button data-z="0">Left</button>
          <button data-z="1">Middle</button>
          <button data-z="2">Right</button>
          <select id="zoomRow"><option value="top">top</option><option value="mid" selected>middle</option><option value="bottom">bottom</option></select>
          <button id="zoomDel">Delete keyframe</button>
        </div>
        <div class="row">
          <button id="save" class="primary">Save (⌘S)</button>
          <span id="saveState"></span>
        </div>
      </div>

      <div class="panel" id="sectionPanel">
        <h2>Section titles</h2>
        <ol id="sections"></ol>
        <button id="addSection">Add title at playhead</button>
      </div>

      <div class="panel" id="transcriptPanel">
        <h2>Transcript</h2>
        <div id="transcript"></div>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
